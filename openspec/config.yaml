schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Simple Agenda — a web app where any user can keep a personal calendar of tasks.
  - Users add entries to a specific day, optionally within an hourly range on that day.
  - Each entry has: title, description, color, and start/end hours.
  - Stack: React + TypeScript on the frontend; Node.js for the backend if/when one is added.
  - Start frontend-first; treat the backend as optional until persistence is needed.

